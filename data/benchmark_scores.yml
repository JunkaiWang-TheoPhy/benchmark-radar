    metric: accuracy
    direction: higher_is_better
    unit: percent
  - benchmark_id: livecodebench
    metric: pass@1
    direction: higher_is_better
    unit: percent
  - benchmark_id: humaneval
    metric: pass@1
    direction: higher_is_better
    unit: percent
  - benchmark_id: gsm8k
    metric: accuracy
    direction: higher_is_better
    unit: percent
  - benchmark_id: mmlu_pro
    metric: accuracy
    direction: higher_is_better
    unit: percent
  - benchmark_id: aime
    metric: pass@1
    direction: higher_is_better
    unit: percent
