radar:
  lookback_hours: 48
  # Sources routinely return several hundred rows a day. The previous 60/30
  # pair discarded most of them before anyone could see them, so the dashboard
  # claimed "228 found" while publishing 8 GitHub records.
  max_items_per_source: 300
  # Cap the daily Issue, not the corpus: the snapshot and dashboard keep every
  # scored record, and only the Markdown digest is truncated to this many.
  report_limit: 300
  issue_item_limit: 40
  # Rubric v2 uses an explainable 0-100 scale. Forty keeps multi-signal
  # releases while explicit low-value patterns fall below the cutoff.
  minimum_score: 40

taxonomy:
  benchmark:
    - benchmark
    - leaderboard
    - test set
    - challenge set
    - evaluation suite
  evaluation:
    - evaluation
    - evaluator
    - judge model
    - red teaming
    - capability eval
    - safety eval
  dataset:
    - dataset
    - corpus
    - data collection
    - synthetic data
    - training data
    - preference data
  data_quality:
    - data quality
    - data contamination
    - deduplication
    - data provenance
    - annotation quality
    - benchmark leakage

# Named artifacts worth surfacing whenever they move, regardless of where the
# generic score places them. A watchlist hit is a routing decision, not a
# quality claim: it pins the record to the top of the digest and labels why.
watchlist:
  - name: PaperBench
    aliases: [paperbench, "paper bench"]
    note: OpenAI benchmark for replicating ML research papers end to end.
  - name: MLE-bench
    aliases: [mlebench, "mle-bench", "mle bench"]
    note: OpenAI benchmark scoring agents on Kaggle-style ML engineering tasks.
  - name: MLE-Marathon
    aliases: ["mle-marathon", "mle marathon", mlemarathon]
    note: Long-running variant of the MLE engineering benchmark family.
  - name: PostRainBench
    aliases: [postrainbench, "postrain bench", "post-rain bench"]
    note: Benchmark for post-processing precipitation and rainfall prediction.
  # "long horizon" alone appears in the abstract of most agent papers, so the
  # aliases require the benchmark noun to keep this from matching everything.
  - name: Long-Horizon Bench
    aliases: ["long horizon bench", "long horizon benchmark", longhorizonbench]
    note: Evaluations targeting extended multi-step agent execution.

sources:
  arxiv:
    enabled: true
    required: true
    # 48h report window + 120h overlap = seven days. arXiv's Atom published
    # timestamp is submission time, while announcements pause on weekends.
    overlap_hours: 120
    request_delay_seconds: 3
    # GitHub-hosted runners are routinely rate-limited by the Atom API's
    # shared-IP quota. Use official category RSS feeds and filter locally.
    # Atom parsing remains available for deployments with a stable egress IP.
    atom_enabled: false
    rss_categories: [cs.AI, cs.CL, cs.CV]
    rss_keywords:
      - benchmark
      - evaluation
      - evaluator
      - leaderboard
      - dataset
      - test set
      - data contamination
      - benchmark leakage
      - data quality
    queries:
      - 'all:"large language model" AND (all:benchmark OR all:evaluation)'
      - '(all:benchmark OR all:dataset) AND (cat:cs.AI OR cat:cs.CL OR cat:cs.CV)'
      - '(all:"data contamination" OR all:"benchmark leakage" OR all:"data quality")'

  huggingface:
    enabled: true
    required: true
    kinds: [datasets]
    searches:
      - benchmark
      - evaluation
      - leaderboard
      - preference
      - synthetic-data

  github:
    enabled: true
    required: true
    queries:
      - '"LLM benchmark" in:name,description,readme'
      - '"AI evaluation" in:name,description,readme'
      - '"benchmark dataset" in:name,description,readme'
      - '"data contamination" in:name,description,readme'

  openalex:
    enabled: true
    searches:
      - large language model benchmark
      - artificial intelligence evaluation dataset
      - benchmark contamination data quality

  brave:
    enabled: true
    searches:
      - new AI benchmark evaluation dataset
      - new LLM benchmark leaderboard
      - AI dataset release data quality

attention:
  feeds:
    - name: Benchmark Social Signal
      enabled: true
      url: "https://raw.githubusercontent.com/ktwu01/benchmark-social-signal/main/feed.json"

publish:
  dashboard_url: "https://ktwu01.github.io/benchmark-radar/"
  issue_title_prefix: "📡 AI Benchmark & Data Radar"
  labels:
    - daily-radar
    - automated
