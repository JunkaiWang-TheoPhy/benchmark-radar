name: WeChat QR Reminder

on:
  schedule:
    # The QR code expires every seven days. Day-of-month */6 keeps the gap at
    # seven days or less, including across month boundaries.
    - cron: "0 1 */6 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create QR replacement reminder
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh issue create \
            --title "Update WeChat group QR code — $(date -u +%Y-%m-%d)" \
            --label automated \
            --body $'1. Paste the new WeChat group QR image directly into this issue.\n\n2. Give the agent this prompt:\n\n```text\nFetch the QR image from this issue, run `git pull --ff-only`, replace `assets/wechat-group-qr.jpg` with the image, commit the change, and push it to `main`.\n```'
