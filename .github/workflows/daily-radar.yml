name: Daily Benchmark Radar

on:
  schedule:
    # One run daily at 01:00 UTC = 09:00 Asia/Singapore (UTC+8, no DST), timed
    # so the GPT briefing and Q&A read same-day insight over breakfast in
    # Singapore. Supersedes the twice-daily Chicago-anchored schedule from
    # issues #44/#104: that pair existed for same-day retry coverage against
    # missed evidence, which this single run trades away for a predictable,
    # once-a-day cadence.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update today's GitHub Issue
        required: true
        type: boolean
        default: false

concurrency:
  group: daily-benchmark-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-report:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report schedule latency
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          read -r scheduled_minute scheduled_hour _ <<< "${SCHEDULE_EXPRESSION}"
          started_at="$(date -u +%s)"
          scheduled_at="$(date -u --date "$(date -u +%F) ${scheduled_hour}:${scheduled_minute}:00" +%s)"
          if (( started_at < scheduled_at )); then
            scheduled_at="$((scheduled_at - 86400))"
          fi
          latency_minutes="$(((started_at - scheduled_at) / 60))"
          {
            echo "### Schedule timing"
            echo "- Cron target: \`${SCHEDULE_EXPRESSION}\`"
            echo "- Scheduled UTC: \`$(date -u --date "@${scheduled_at}" --iso-8601=seconds)\`"
            echo "- Runner start UTC: \`$(date -u --date "@${started_at}" --iso-8601=seconds)\`"
            echo "- Trigger latency: **${latency_minutes} minutes**"
          } >> "${GITHUB_STEP_SUMMARY}"
          if (( latency_minutes >= 240 )); then
            echo "::warning title=Delayed scheduled trigger::GitHub started this workflow ${latency_minutes} minutes after its cron target"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Collect evidence and public attention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Publishing a deterministic fallback would look successful while
          # violating the purpose of this production run: prove a real GPT
          # synthesis occurred and retain its model/usage metadata.
          OPENAI_BRIEFING_REQUIRED: "true"
          # Issue #159: the Q&A implementation shipped opt-in behind this flag
          # and production never set it, so every run silently skipped
          # question generation despite a successful briefing. Enabling and
          # requiring it here closes that gap the same way the briefing is
          # required above: a green run must carry real answers, not a quiet
          # absence.
          OPENAI_QUESTIONS: "true"
          OPENAI_QUESTIONS_REQUIRED: "true"
        run: benchmark-radar
      - name: Upload evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: |
            out/
            data/snapshots/
            site/data/radar.json
          retention-days: 30

  persist-snapshot:
    needs: build-report
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create snapshot-writer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RADAR_APP_ID }}
          private-key: ${{ secrets.RADAR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: benchmark-radar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Download validated snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: generated/
      - name: Persist UTC snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/snapshots
          cp generated/data/snapshots/*.json data/snapshots/
          git config user.name "benchmark-radar[bot]"
          git config user.email "benchmark-radar[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --name-only |
            grep -Ev '^data/snapshots/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'
          then
            echo "::error::Snapshot writer attempted to modify an unexpected path"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "UTC snapshot is already current"
            exit 0
          fi
          git commit -m "Record daily radar snapshot"
          git push origin HEAD:main

  # Issue #37: keep the daily Issue as a secondary, GitHub-native discussion
  # channel after RSS ships. The dashboard and site/feed.xml are the primary
  # reading and subscription surfaces; this job no longer fills a feed gap.
  #
  # Since issue #88, the issue also carries the day's social post material and
  # its posting checklist. The social section is generated deterministically
  # here (never by a model) from the day's evidence plus the last 24 hours of
  # git history, and the checklist re-applies ticks already made on the same
  # day's issue so a retry never resets posting progress.
  publish-issue:
    needs: [build-report, persist-snapshot]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout before downloading the artifact: actions/checkout clears a
      # non-repository workspace, which would delete a previously downloaded
      # generated/ directory. main is checked out explicitly so the repo-change
      # sentence also counts the snapshot commit persist-snapshot pushes while
      # this workflow is running, instead of the stale event SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download validated report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-radar-${{ github.run_id }}
          path: generated/
      # The repo-change sentence reads the last 24 hours of git history, which
      # the full fetch above provides rather than the default shallow single
      # commit.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Create idempotent daily issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          date_key="$(date -u +%Y-%m-%d)"
          title="📡 AI Benchmark & Data Radar — ${date_key}"
          existing="$(gh issue list --state all --search "\"${title}\" in:title" \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          existing_body_args=()
          if [[ -n "${existing}" ]]; then
            gh issue view "${existing}" --json body --jq .body > generated/out/current_body.md
            existing_body_args=(--existing-body generated/out/current_body.md)
          fi
          benchmark-radar social \
            --items generated/out/items.json \
            --repo . \
            --channels config/social.yml \
            "${existing_body_args[@]}" \
            --social-output generated/out/social.md
          {
            cat generated/out/report.md
            printf '\n\n'
            cat generated/out/social.md
          } > generated/out/body.md
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" --body-file generated/out/body.md
            echo "Updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file generated/out/body.md \
              --label daily-radar --label automated
          fi
