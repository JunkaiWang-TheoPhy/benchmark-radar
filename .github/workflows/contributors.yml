name: Update contributors image

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - ".github/workflows/contributors.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors-image
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate contributors image
        uses: jaywcjlove/github-action-contributors@86707f6d4c2469ce6b46bc3367253ebd41ee242c # v2.1.0
        with:
          output: assets/contributors.svg
          avatarSize: 42
          excludeBots: "true"

      - name: Propose updated image
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/update-contributors-image
          delete-branch: true
          commit-message: "chore: update contributors image"
          title: "chore: update contributors image"
          body: |
            Updates the generated contributor profile image.

            This pull request was opened automatically by the contributors workflow.
          base: main
