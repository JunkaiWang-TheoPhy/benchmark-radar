name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # Before pytest, not just before classify. The search index and the 1,148
      # per-benchmark shards are derived and untracked, so a fresh checkout has
      # neither, and `classify` builds the crawled half of site/data/models.json
      # by globbing the shard directory. Running it first also un-skips the
      # corpus-backed tests, which guarded themselves on those files existing
      # and so had never run in CI at all.
      - run: benchmark-radar normalize-external
      - run: pytest -q
      - run: benchmark-radar classify
