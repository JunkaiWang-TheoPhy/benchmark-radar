name: Show how you use Benchmark Radar / 展示你的使用场景
description: Share a project, paper, evaluation, or workflow that Benchmark Radar helped. / 分享 Benchmark Radar 帮到的项目、论文、评测或工作流。
title: "[3 points] 真实使用案例 / Real use case: "
labels: ["use-case"]
body:
  - type: markdown
    attributes:
      value: "Propose any real use case—not only the examples in the collaboration call. An accepted case is worth 3 points. After acceptance, comment `/claim`; one person gets 7 days to complete it. / 可以提出任何真实使用案例，不限于协作征集中的例子。通过后为 3 分；请评论 `/claim` 认领，每次仅一人，7 天内完成。"

  - type: textarea
    id: use
    attributes:
      label: How did Benchmark Radar help? / Benchmark Radar 怎么帮到你
      description: What you are building, and which page or dataset was useful. / 你在做什么，哪个页面或数据集帮到了你。
      placeholder: "An agent evaluation suite for customer support: the leaderboard helped us pick ... / 面向客服的 agent 评测套件，排行榜帮我们选了 ..."
    validations:
      required: true

  - type: textarea
    id: worthy
    attributes:
      label: Why is this worth sharing? / 为什么值得分享
      description: What another reader should notice first. / 另一个读者最应该先看到什么。
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Public link / 公开链接
      description: Optional project, paper, post, or repository. / 可选：项目、论文、帖子或仓库。
      placeholder: https://example.com/my-eval-project
    validations:
      required: false

  - type: textarea
    id: feedback
    attributes:
      label: What would make it more useful? / 还希望它改进什么
      description: Optional. / 可选。
    validations:
      required: false
